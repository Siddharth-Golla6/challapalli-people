<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Icons: yellow challapalli circular mark, raster so legacy browsers +
         WhatsApp share previews render it correctly. The SVG is kept as a
         fallback link in case the PNGs 404 during a half-deployed build. -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/logo-192.png" sizes="192x192" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon-32.png" type="image/png" />

    <!-- Page title + core description. Keep description under ~160
         characters so Google doesn't truncate it in search results. -->
    <title>challapalli.people — Challapalli People civic grievance platform (challapallipeople)</title>
    <meta
      name="description"
      content="challapalli.people (challapallipeople) is the official civic engagement platform for the Challapalli People — the 18 wards of Challapalli Gram Panchayat. Report issues, share suggestions, give feedback. English + Telugu."
    />
    <meta
      name="keywords"
      content="challapalli.people, challapallipeople, challapalli people, Challapalli, gram panchayat, civic engagement, grievance redressal, Krishna district, Andhra Pradesh, 18 wards, people's voice, suggestions, feedback, Telugu, panchayat portal"
    />
    <meta name="author" content="challapalli.people" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#047857" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#065F46" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://challapallipeople.com/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="challapalli.people" />
    <meta property="og:url" content="https://challapallipeople.com/" />
    <meta property="og:title" content="challapalli.people — Your Ward. Your Voice. Our Challapalli." />
    <meta
      property="og:description"
      content="Report civic issues, share suggestions and give feedback across the 18 wards of Challapalli Gram Panchayat. Bilingual (English + Telugu), free, open."
    />
    <meta property="og:image" content="https://challapallipeople.com/logo-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="challapalli.people — civic engagement platform for all 18 wards of Challapalli Gram Panchayat" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:locale:alternate" content="te_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="challapalli.people — Your Ward. Your Voice. Our Challapalli." />
    <meta
      name="twitter:description"
      content="Report civic issues, share suggestions and give feedback across the 18 wards of Challapalli Gram Panchayat. Bilingual (English + Telugu), free, open."
    />
    <meta name="twitter:image" content="https://challapallipeople.com/logo-512.png" />
    <meta name="twitter:image:alt" content="challapalli.people — civic engagement platform for all 18 wards of Challapalli Gram Panchayat" />

    <!-- Fonts: preconnect + preload the stylesheet so FOUT is minimal. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data for search engines. Describes the site as a civic
         WebSite / GovernmentOrganization so Google can render a rich card. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://challapallipeople.com/#website",
            "url": "https://challapallipeople.com/",
            "name": "challapalli.people",
            "description": "Civic engagement platform for the 18 wards of Challapalli Gram Panchayat, Krishna District, Andhra Pradesh.",
            "inLanguage": ["en-IN", "te-IN"],
            "publisher": { "@id": "https://challapallipeople.com/#org" }
          },
          {
            "@type": "GovernmentOrganization",
            "@id": "https://challapallipeople.com/#org",
            "name": "challapalli.people",
            "alternateName": ["challapallipeople", "Challapalli People", "Challapalli Gram Panchayat Platform"],
            "url": "https://challapallipeople.com/",
            "logo": "https://challapallipeople.com/logo-512.png",
            "slogan": "Your Ward. Your Voice. Our Challapalli.",
            "areaServed": {
              "@type": "AdministrativeArea",
              "name": "Challapalli Gram Panchayat",
              "containedInPlace": {
                "@type": "AdministrativeArea",
                "name": "Krishna District, Andhra Pradesh, India"
              }
            }
          }
        ]
      }
    </script>

    <!-- Theme preference bootstrap: avoid a dark/light flash before React
         mounts. The storage key is `md_theme_v2`; the legacy `md_theme` key
         is intentionally ignored and cleared by ThemeContext so every
         browser lands on the new dark-first default on next visit. -->
    <script>
      (function () {
        try {
          localStorage.removeItem("md_theme");
          var stored = localStorage.getItem("md_theme_v2");
          var dark = stored ? stored === "dark" : true;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
