[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — client-side routes (React Router) need every path to
# resolve to index.html, or a direct link/refresh on e.g. /dashboard 404s.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Defence-in-depth headers on every response. CSP caps the blast radius of
# any accidental XSS; the rest harden framing, MIME sniffing and sensor
# access. R2 photo origin is matched by `img-src ... https:` so the config
# stays stable if the bucket's public URL changes.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self'; connect-src 'self' https://challapalli-people-api.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "0"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), interest-cohort=(), browsing-topics=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Admin + resident-private paths should never appear in Google's index, and
# must bypass any CDN/browser cache so an admin's dashboard doesn't get
# served to someone sharing the device.
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/my-reports*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store, max-age=0"
